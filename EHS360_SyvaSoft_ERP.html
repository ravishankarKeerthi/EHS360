<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHS360 — SyvaSoft EHS Management ERP</title>
<style>
:root{
 --navy:#10233f;--blue:#1769aa;--cyan:#13a8a8;--green:#198754;--amber:#d99100;
 --red:#d64545;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#6b778c;
 --line:#e3e9f1;--shadow:0 8px 24px rgba(16,35,63,.08);--radius:14px
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:260px;background:var(--navy);color:#fff;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:20}
.brand{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#17b6b6,#1769aa);display:grid;place-items:center;font-weight:900}
.brand strong{font-size:18px}.brand small{display:block;color:#aebbd0;margin-top:2px}
.nav{padding:14px 10px}.nav-section{font-size:10px;letter-spacing:1.3px;color:#8293ad;margin:16px 10px 7px;text-transform:uppercase}
.nav button{width:100%;border:0;background:transparent;color:#d9e2ef;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0}
.nav button:hover,.nav button.active{background:#1d3b62;color:#fff}.nav .ico{display:inline-block;width:24px}
.main{margin-left:260px;width:calc(100% - 260px)}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.search{width:min(420px,40vw);background:#f3f6fa;border:1px solid var(--line);padding:10px 14px;border-radius:10px}
.user{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:#d9eef2;display:grid;place-items:center;color:#116c75;font-weight:700}
.content{padding:26px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pagehead h1{margin:0;font-size:26px}.pagehead p{margin:5px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:9px;font-weight:650}.btn:hover{box-shadow:var(--shadow)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.success{background:var(--green);color:#fff;border-color:var(--green)}.btn.warn{background:var(--amber);color:#fff;border-color:var(--amber)}.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}.btn.sm{padding:6px 9px;font-size:12px}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(6,minmax(150px,1fr))}.two{grid-template-columns:1.3fr .7fr}.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:28px;font-weight:800;margin:7px 0}.kpi .foot{font-size:11px;color:var(--muted)}.kpi.red .value{color:var(--red)}.kpi.green .value{color:var(--green)}.kpi.amber .value{color:var(--amber)}
.card h3{margin:0 0 14px}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750;background:#edf2f8;color:#506078}.badge.green{background:#e7f6ed;color:#14753f}.badge.red{background:#fdeaea;color:#a62e2e}.badge.amber{background:#fff4dc;color:#9a6700}.badge.blue{background:#e6f0fb;color:#14598e}
table{width:100%;border-collapse:collapse}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#fafbfd}tr:hover td{background:#fbfcfe}
.progress{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}
.heatmap{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.heat{height:46px;display:grid;place-items:center;border-radius:6px;font-weight:800;font-size:12px}.h1{background:#d9f2df}.h2{background:#edf3bf}.h3{background:#ffe0a4}.h4{background:#ffb8a9}.h5{background:#e97b78;color:#fff}
.timeline{border-left:2px solid #dce5ef;padding-left:18px}.event{position:relative;margin:0 0 18px}.event:before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue)}.event b{display:block}.event small{color:var(--muted)}
.empty{padding:35px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:#15243a;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:100;display:none}.toast.show{display:block}
.modal{position:fixed;inset:0;background:rgba(12,27,48,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(850px,96vw);max-height:92vh;overflow:auto;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modalhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalbody{padding:22px}.modalfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d6deea;border-radius:8px;padding:10px;background:#fff}.field.full{grid-column:1/-1}.field textarea{min-height:90px;resize:vertical}
.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.detail div{background:#f7f9fc;border-radius:9px;padding:11px}.detail small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.detail b{display:block;margin-top:4px}
.alert{padding:12px 14px;border-radius:10px;background:#fff5df;border:1px solid #f0d28c;margin-bottom:12px}.alert.red{background:#fff0f0;border-color:#efb4b4}.alert.green{background:#effaf3;border-color:#bde2c8}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.sidebar{width:220px}.main{margin-left:220px;width:calc(100% - 220px)}}
@media(max-width:760px){.sidebar{position:fixed;transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.topbar{padding:0 14px}.search{width:42vw}.content{padding:16px}.kpis,.three,.formgrid,.detail{grid-template-columns:1fr}.menuBtn{display:block!important}}
.menuBtn{display:none;border:0;background:none;font-size:22px}
.chart{height:180px;display:flex;align-items:flex-end;gap:12px;padding:20px 5px 0}.bar{flex:1;background:linear-gradient(#1769aa,#55b7d0);border-radius:6px 6px 0 0;min-height:8px;position:relative}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="logo">E</div><div><strong>EHS360</strong><small>SyvaSoft EHS ERP</small></div></div>
  <div class="nav">
    <div class="nav-section">Command Center</div>
    <button data-page="dashboard" class="active">📊 <span class="ico"></span>Dashboard</button>
    <button data-page="mywork">🧭 My Work</button>
    <div class="nav-section">Masters</div>
    <button data-page="people">👥 People & Contractors</button>
    <button data-page="locations">📍 Sites & Locations</button>
    <button data-page="hazards">⚠️ Hazards & Risk</button>
    <button data-page="jsa">🧩 JSA / JHA</button>
    <button data-page="moc">🔄 Management of Change</button>
    <button data-page="loto">🔒 LOTO / Isolation</button>
    <button data-page="assets">⚙️ Assets</button>
    <div class="nav-section">Safety Operations</div>
    <button data-page="permits">🛡️ Work Permits</button>
    <button data-page="inspections">🔎 Inspections</button>
    <button data-page="observations">👁️ Safety Observations</button>
    <button data-page="incidents">🚨 Incidents</button>
    <button data-page="capa">✅ CAPA</button>
    <button data-page="ppe">🦺 PPE</button>
    <button data-page="health">🩺 Occupational Health</button>
    <div class="nav-section">Competency & Emergency</div>
    <button data-page="training">🎓 Training</button>
    <button data-page="emergency">🔥 Emergency & Drills</button>
    <div class="nav-section">Environment</div>
    <button data-page="environment">🌱 Environmental Management</button>
    <button data-page="waste">♻️ Waste & Disposal</button>
    <div class="nav-section">Governance</div>
    <button data-page="compliance">📋 Legal Compliance</button>
    <button data-page="audits">📝 Audits</button>
    <button data-page="documents">📚 Document Control</button>
    <button data-page="objectives">🎯 Objectives & Programs</button>
    <button data-page="committees">👥 Safety Committee</button>
    <button data-page="reports">📈 Reports & Analytics</button>
    <div class="nav-section">Administration</div>
    <button data-page="settings">⚙️ EHS Settings</button>
  </div>
</aside>

<main class="main">
<header class="topbar">
  <button class="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
  <input class="search" id="globalSearch" placeholder="Search incidents, permits, risks, people...">
  <div class="user"><div><b>Ravi</b><small class="muted"> · EHS Manager</small></div><div class="avatar">R</div></div>
</header>
<section class="content" id="appContent"></section>
</main>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const seed={
 incidents:[
  {id:"INC-2026-0012",type:"Near Miss",title:"Forklift reversing near pedestrian lane",location:"Plant 2 / Dispatch",date:"06 Oct 2026",severity:"High",status:"Investigation",owner:"Arun"},
  {id:"INC-2026-0011",type:"First Aid",title:"Minor hand injury during packing",location:"Plant 1 / Packing",date:"04 Oct 2026",severity:"Medium",status:"CAPA Open",owner:"Meena"},
  {id:"INC-2026-0010",type:"Environmental",title:"Small oil spill at maintenance bay",location:"Plant 1 / Maintenance",date:"02 Oct 2026",severity:"Medium",status:"Closed",owner:"Suresh"}],
 permits:[
  {id:"PTW-2026-008",type:"Hot Work",location:"Plant 2 / Fabrication",requester:"Kumar",start:"06 Oct 2026 10:00",end:"06 Oct 2026 16:00",status:"Pending Approval",risk:"High"},
  {id:"PTW-2026-007",type:"Work at Height",location:"Plant 1 / Utility",requester:"Ravi",start:"06 Oct 2026 09:00",end:"06 Oct 2026 13:00",status:"Issued",risk:"Medium"}],
 risks:[
  {id:"RISK-045",activity:"Grinding operation",hazard:"Flying particles",location:"Plant 1 / Grinding",sev:4,lik:4,score:16,level:"High",owner:"Arun",due:"12 Oct 2026"},
  {id:"RISK-044",activity:"Solvent cleaning",hazard:"Chemical exposure",location:"Plant 2 / Paint Shop",sev:4,lik:3,score:12,level:"High",owner:"Meena",due:"10 Oct 2026"},
  {id:"RISK-043",activity:"Material handling",hazard:"Manual handling",location:"Warehouse",sev:3,lik:2,score:6,level:"Medium",owner:"Suresh",due:"18 Oct 2026"}],
 capa:[
  {id:"CAPA-102",source:"INC-2026-0012",finding:"Pedestrian and forklift route conflict",owner:"Arun",due:"10 Oct 2026",priority:"High",status:"Open"},
  {id:"CAPA-101",source:"INSP-2026-045",finding:"Emergency exit partially obstructed",owner:"Meena",due:"08 Oct 2026",priority:"High",status:"Overdue"},
  {id:"CAPA-100",source:"AUD-2026-012",finding:"Training evidence missing",owner:"HR",due:"15 Oct 2026",priority:"Medium",status:"In Progress"}],
 training:[
  {name:"Fire & Emergency Response",employee:"125",valid:"20 Oct 2026",status:"Expiring"},
  {name:"Work at Height",employee:"34",valid:"02 Nov 2026",status:"Valid"},
  {name:"Chemical Handling",employee:"48",valid:"12 Oct 2026",status:"Expiring"}],
 compliance:[
  {id:"LAW-001",requirement:"Fire NOC / Fire Safety Compliance",site:"Plant 1",due:"15 Oct 2026",status:"Due Soon",owner:"EHS"},
  {id:"LAW-002",requirement:"Hazardous Waste Authorization",site:"Plant 2",due:"28 Oct 2026",status:"Compliant",owner:"EHS"},
  {id:"LAW-003",requirement:"Periodic Electrical Inspection",site:"Plant 1",due:"03 Oct 2026",status:"Overdue",owner:"Maintenance"}],
 observations:[
  {id:"OBS-201",type:"Unsafe Condition",title:"Damaged guard rail",location:"Plant 2",status:"Action Required",date:"06 Oct 2026"},
  {id:"OBS-200",type:"Safe Act",title:"Correct PPE usage",location:"Plant 1",status:"Closed",date:"05 Oct 2026"}]
};
const extended={
  jsa:[
    {id:"JSA-026",activity:"Grinding Operation",location:"Plant 1 / Grinding",status:"Approved",risk:"High",owner:"Arun"},
    {id:"JSA-025",activity:"Chemical Cleaning",location:"Plant 2 / Paint Shop",status:"Review Required",risk:"High",owner:"Meena"}],
  loto:[
    {id:"LOTO-014",equipment:"Hydraulic Press H-04",location:"Plant 1",status:"Ready for Verification",owner:"Maintenance"},
    {id:"LOTO-013",equipment:"Conveyor C-07",location:"Warehouse",status:"Released",owner:"Suresh"}],
  moc:[
    {id:"MOC-009",change:"New solvent in Paint Shop",type:"Process Change",risk:"High",status:"Risk Review",owner:"EHS"},
    {id:"MOC-008",change:"Machine layout change",type:"Layout",risk:"Medium",status:"Approved",owner:"Plant Manager"}],
  health:[
    {id:"OH-102",employee:"EMP-125",program:"Annual Fitness",due:"15 Oct 2026",status:"Due Soon"},
    {id:"OH-101",employee:"EMP-087",program:"Noise Exposure",due:"22 Oct 2026",status:"Scheduled"}],
  documents:[
    {id:"DOC-EHS-012",title:"EHS Policy",type:"Policy",version:"3.0",review:"01 Jan 2027",status:"Controlled"},
    {id:"DOC-EHS-013",title:"Hot Work Procedure",type:"Procedure",version:"2.1",review:"15 Dec 2026",status:"Controlled"}],
  objectives:[
    {id:"OBJ-026",objective:"Reduce near misses by 20%",target:"20%",actual:"12%",status:"On Track",owner:"EHS"},
    {id:"OBJ-027",objective:"Achieve 95% training compliance",target:"95%",actual:"94%",status:"At Risk",owner:"HR"}],
  committees:[
    {id:"SCM-010",title:"Monthly Safety Committee",date:"10 Oct 2026",owner:"EHS",status:"Scheduled"}]
};
const storedDb=JSON.parse(localStorage.getItem("ehs360_db")||"null");
db=storedDb ? Object.assign(extended,storedDb) : Object.assign({},seed,extended);
function save(){localStorage.setItem("ehs360_db",JSON.stringify(db))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function badge(s){let c=/high|overdue|red|investigation|action/i.test(s)?"red":/medium|pending|due|expir/i.test(s)?"amber":/closed|valid|compliant|issued/i.test(s)?"green":"blue";return `<span class="badge ${c}">${esc(s)}</span>`}
function pageHead(title,desc,buttons=""){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function btn(label,action,cls=""){return `<button class="btn ${cls}" onclick="${action}">${label}</button>`}
function table(headers,rows){return `<div class="card" style="padding:0;overflow:auto"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}"><div class="empty">No records found</div></td></tr>`}</tbody></table></div>`}

function dashboard(){
let high=db.risks.filter(x=>x.level==="High").length, overdue=db.capa.filter(x=>x.status==="Overdue").length, openInc=db.incidents.filter(x=>x.status!=="Closed").length;
return pageHead("EHS Command Center","One operational view of safety, risk, compliance and environment.",
btn("🚨 Report Incident","openIncident()","danger")+btn("🛡️ New Permit","openPermit()","primary")+btn("⚠️ Assess Risk","openRisk()"))+
`<div class="grid kpis">
<div class="card kpi red"><div class="label">HIGH RISKS</div><div class="value">${high}</div><div class="foot">Immediate control required</div></div>
<div class="card kpi red"><div class="label">OPEN INCIDENTS</div><div class="value">${openInc}</div><div class="foot">Including investigations</div></div>
<div class="card kpi amber"><div class="label">OVERDUE CAPA</div><div class="value">${overdue}</div><div class="foot">Escalation required</div></div>
<div class="card kpi amber"><div class="label">PERMITS ACTIVE</div><div class="value">${db.permits.filter(x=>x.status==="Issued").length}</div><div class="foot">Work under control</div></div>
<div class="card kpi green"><div class="label">TRAINING COMPLIANCE</div><div class="value">94%</div><div class="foot">Target ≥ 95%</div></div>
<div class="card kpi green"><div class="label">INSPECTION SCORE</div><div class="value">91%</div><div class="foot">This month</div></div></div>
<div class="grid two" style="margin-top:16px">
<div class="card"><h3>Risk Heat Map <span class="muted">· current register</span></h3><div class="heatmap">${[1,2,3,4,5].map(y=>[1,2,3,4,5].map(x=>`<div class="heat h${Math.min(5,x*y>12?5:x*y>8?4:x*y>4?3:x*y>2?2:1)}">${x*y}</div>`).join("")).join("")}</div><div class="muted" style="margin-top:14px;font-size:12px">Likelihood → &nbsp; Severity ↑ &nbsp; | Score = Likelihood × Severity</div></div>
<div class="card"><h3>Critical attention</h3><div class="alert red"><b>${high} high risks</b><br><small>Review controls and due dates.</small></div><div class="alert"><b>${overdue} overdue actions</b><br><small>Owners need escalation.</small></div><div class="alert green"><b>0 critical incidents today</b><br><small>Continue proactive reporting.</small></div></div></div>
<div class="grid two" style="margin-top:16px">
<div class="card"><h3>Incident Trend</h3><div class="chart">${[8,12,7,15,10,18,13,11,16,9,12,7].map((v,i)=>`<div class="bar" style="height:${v*7}px"><span>${["N","D","J","F","M","A","M","J","J","A","S","O"][i]}</span></div>`).join("")}</div></div>
<div class="card"><h3>Latest activity</h3><div class="timeline"><div class="event"><b>Incident INC-2026-0012 reported</b><small>Near miss · 06 Oct · Plant 2</small></div><div class="event"><b>PTW-2026-008 awaiting approval</b><small>Hot Work · Fabrication</small></div><div class="event"><b>CAPA-101 overdue</b><small>Emergency exit finding</small></div><div class="event"><b>Risk RISK-045 assessed High</b><small>Grinding operation</small></div></div></div></div>`;
}

function listPage(title,desc,data,kind,headers,rows,actions){
return pageHead(title,desc,actions)+table(headers,rows);
}
function incidents(){
let rows=db.incidents.map(x=>`<tr><td><b>${x.id}</b></td><td>${badge(x.type)}</td><td>${esc(x.title)}</td><td>${esc(x.location)}</td><td>${x.date}</td><td>${badge(x.severity)}</td><td>${badge(x.status)}</td><td>${btn("Open",`smartRecordModal('incident','${x.id}')`,"sm")}</td></tr>`);
return listPage("Incident Management","Report, investigate, contain and close every event.",
db.incidents,"inc",["ID","Type","Description","Location","Date","Severity","Status",""],rows,btn("＋ Report Incident","openIncident()","danger"));
}
function permits(){
let rows=db.permits.map(x=>`<tr><td><b>${x.id}</b></td><td>${badge(x.type)}</td><td>${x.location}</td><td>${x.requester}</td><td>${x.start}</td><td>${badge(x.risk)}</td><td>${badge(x.status)}</td><td>${btn("Open",`smartRecordModal('permit','${x.id}')`,"sm")}</td></tr>`);
return listPage("Work Permit Management","Control hazardous work before it starts.",
db.permits,"permit",["ID","Type","Location","Requester","Start","Risk","Status",""],rows,btn("＋ New Permit","openPermit()","primary"));
}
function risks(){
let rows=db.risks.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.activity}</td><td>${x.hazard}</td><td>${x.location}</td><td>${x.sev}</td><td>${x.lik}</td><td><b>${x.score}</b></td><td>${badge(x.level)}</td><td>${x.due}</td><td>${btn("Open",`smartRecordModal('hazard','${x.id}')`,"sm")}</td></tr>`);
return listPage("Risk Register","Identify hazards, calculate risk and manage controls.",
db.risks,"risk",["ID","Activity","Hazard","Location","Severity","Likelihood","Score","Level","Due",""],rows,btn("＋ Assess Risk","openRisk()","primary"));
}
function capa(){
let rows=db.capa.map(x=>`<tr><td><b>${x.id}</b></td><td>${x.source}</td><td>${x.finding}</td><td>${x.owner}</td><td>${x.due}</td><td>${badge(x.priority)}</td><td>${badge(x.status)}</td><td>${btn("Open",`smartRecordModal('capa','${x.id}')`,"sm")}</td></tr>`);
return listPage("CAPA Management","Corrective and preventive action from every EHS finding.",
db.capa,"capa",["ID","Source","Finding","Owner","Due","Priority","Status",""],rows,btn("＋ New CAPA","openCapa()","primary"));
}
function observations(){
let rows=db.observations.map(x=>`<tr><td>${x.id}</td><td>${badge(x.type)}</td><td>${x.title}</td><td>${x.location}</td><td>${x.date}</td><td>${badge(x.status)}</td><td>${btn("Open",`smartRecordModal('observation','${x.id}')`,"sm")}</td></tr>`);
return listPage("Safety Observations","Capture safe acts and unsafe conditions before they become incidents.",db.observations,"obs",["ID","Type","Observation","Location","Date","Status",""],rows,btn("＋ New Observation","openObservation()","primary"));
}

`<div class="grid three"><div class="card"><h3>Fire Safety</h3><p class="muted">25 questions · monthly</p><div class="progress"><i style="width:92%"></i></div><p><b>92%</b> last score</p>${btn("Start","openInspection()","sm")}</div><div class="card"><h3>Machine Safety</h3><p class="muted">32 questions · weekly</p><div class="progress"><i style="width:87%"></i></div><p><b>87%</b> last score</p>${btn("Start","openInspection()","sm")}</div><div class="card"><h3>PPE Compliance</h3><p class="muted">15 questions · daily</p><div class="progress"><i style="width:96%"></i></div><p><b>96%</b> last score</p>${btn("Start","openInspection()","sm")}</div></div>

function modal(title,body,foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveModal()">Save</button>`){document.getElementById("modalBox").innerHTML=`<div class="modalhead"><h3 style="margin:0">${title}</h3><button class="btn" onclick="closeModal()">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot">${foot}</div>`;document.getElementById("modal").classList.add("show")}
function field(label,name,type="text",value="",opts=""){if(type==="select")return `<div class="field"><label>${label}</label><select name="${name}">${opts.split("|").map(o=>`<option>${o}</option>`).join("")}</select></div>`;return `<div class="field ${type==="textarea"?"full":""}"><label>${label}</label>${type==="textarea"?`<textarea name="${name}">${value}</textarea>`:`<input name="${name}" type="${type}" value="${value}" />`}</div>`}
let currentSave=null;
function showForm(title,fields,cb){currentSave=cb;modal(title,`<form id="form" class="formgrid">${fields.join("")}</form>`)}
function saveModal(){let f=document.getElementById("form");if(!f){closeModal();return}let data=Object.fromEntries(new FormData(f).entries());if(currentSave)currentSave(data);closeModal()}
function closeModal(){document.getElementById("modal").classList.remove("show");currentSave=null}

function exportData(){let rows=[["Type","ID","Status"]];Object.entries(db).forEach(([k,v])=>Array.isArray(v)&&v.forEach(x=>rows.push([k,x.id||x.name||"",x.status||""])));let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\\n");let a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="EHS360_Export.csv";a.click();toast("CSV exported")}

function normalizeRecord(rec,key){
  if(!rec) return {};
  const aliases={incident:"id",permit:"id",hazard:"id",capa:"id",observation:"id",jsa:"id",loto:"id",moc:"id",training:"id",health:"id",compliance:"id",audit:"id",document:"id",objective:"id",committee:"id"};
  return rec;
}
function displayValue(v){ if(v===undefined||v===null||v==="") return "—"; return esc(v); }

function fullRecordView(key,record){
 const meta=moduleMeta[key]; if(!meta) return "";
 const vals=record||{};
 let rows=meta.fields.map((f,i)=>{
   let val=vals[f]??vals[f.replace(/[^a-zA-Z0-9]/g,"").toLowerCase()]??vals[Object.keys(vals).find(k=>k.toLowerCase().replace(/[^a-z0-9]/g,"")===f.toLowerCase().replace(/[^a-z0-9]/g,""))]??"";
   return `<div><small>${esc(f)}</small><b>${displayValue(val)}</b></div>`;
 }).join("");
 return `<div class="detail" style="grid-template-columns:repeat(3,1fr)">${rows}</div>`;
}

function smartRecordModal(key,id){
 const meta=moduleMeta[key], arr=db[meta.dataKey]||[];
 let r=arr.find(x=>String(x.id||"")===String(id))||arr[0]||{};
 modal(`${meta.title} — ${id}`,
 `<div class="alert green"><b>Record workspace</b><br>All fields, evidence, actions and workflow decisions should remain linked to this record.</div>

}
